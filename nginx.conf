server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The shared link is a real path, so every unknown path falls back to the app rather than to a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
